    const loadSafeStorage = (key, fallback) => {
      try {
        const item = localStorage.getItem(key);
        if (item && item !== 'undefined' && item !== 'null') {
          return JSON.parse(item);
        }
      } catch (e) {
        console.warn(`Storage Error bei ${key}, setze auf Standard zurück.`);
        localStorage.removeItem(key);
      }
      return fallback;
    };

    const triggerHaptic = (pattern = 50) => {
      if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(pattern);
    };

    const openMaps = (e, query) => {
      e.stopPropagation();
      window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
    };

    const openBooking = (e, link) => {
      if(!link) return;
      e.stopPropagation();
      window.open(link, '_blank');
    };

    function LondonReiseplanerPro() {
      const [activeSelections, setActiveSelections] = useState(() => loadSafeStorage('london_activeSelections', {}));
      const [completedItems, setCompletedItems] = useState(() => loadSafeStorage('london_completedItems', {}));
      const [ticketsSecured, setTicketsSecured] = useState(() => loadSafeStorage('london_ticketsSecured', {}));
      const [tripData, setTripData] = useState(() => loadSafeStorage('london_tripData', initialItineraryData));
      const [budgetLimit, setBudgetLimit] = useState(() => loadSafeStorage('london_budgetLimit', 500));
      const [extraExpenses, setExtraExpenses] = useState(() => loadSafeStorage('london_extraExpenses', 0));
      
      const [isEditMode, setIsEditMode] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [isEditingBudget, setIsEditingBudget] = useState(false);

      const [isRoutingMode, setIsRoutingMode] = useState(false);
      const [routePoints, setRoutePoints] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);
      
      const [isHighContrast, setIsHighContrast] = useState(false);
      const [isEuro, setIsEuro] = useState(false);
      const [currentTheme, setCurrentTheme] = useState('day');
      
      const EUR_RATE = 1.18;
      const dayRefs = useRef([]);

      useEffect(() => {
        localStorage.setItem('london_activeSelections', JSON.stringify(activeSelections));
        localStorage.setItem('london_completedItems', JSON.stringify(completedItems));
        localStorage.setItem('london_ticketsSecured', JSON.stringify(ticketsSecured));
        localStorage.setItem('london_tripData', JSON.stringify(tripData));
        localStorage.setItem('london_budgetLimit', JSON.stringify(budgetLimit));
        localStorage.setItem('london_extraExpenses', JSON.stringify(extraExpenses));
      }, [activeSelections, completedItems, ticketsSecured, tripData, budgetLimit, extraExpenses]);

      const syncToCloud = async () => {
        setIsSyncing(true);
        triggerHaptic(50);
        try {
          const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify({ activeSelections, completedItems, ticketsSecured, tripData, budgetLimit, extraExpenses })
          });
          if (!response.ok) throw new Error('Netzwerk-Antwort war nicht ok');
          triggerHaptic([30, 50, 30]);
          alert('✅ Fortschritt erfolgreich in der Cloud gespeichert!');
        } catch(error) {
          console.error('Sync Error:', error);
          alert('❌ Fehler beim Speichern in der Cloud.');
        } finally {
          setIsSyncing(false);
        }
      };

      const handleRouteSelection = (option) => {
        triggerHaptic(30);
        setRoutePoints(prev => {
          const isSelected = prev.find(p => p.id === option.id);
          if (isSelected) return prev.filter(p => p.id !== option.id);
          return [...prev, option];
        });
      };

      const generateGoogleMapsRoute = () => {
        if (routePoints.length === 0) return;
        triggerHaptic(80);
        const origin = routePoints[0].mapsQuery;
        const destination = routePoints[routePoints.length - 1].mapsQuery;
        let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=walking`;
        if (routePoints.length > 2) {
          const waypoints = routePoints.slice(1, -1).map(p => p.mapsQuery).join('|');
          url += `&waypoints=${waypoints}`;
        }
        window.open(url, '_blank');
        setIsRoutingMode(false);
        setRoutePoints([]);
      };

      useEffect(() => {
        const hour = new Date().getHours();
        if (hour < 6 || hour > 18) setCurrentTheme('night');
        else setCurrentTheme('day');
      }, []);

      const getActiveIndex = (blockId) => activeSelections[blockId] || 0;

      const handleSwap = (e, blockId) => {
        e.stopPropagation();
        triggerHaptic([30, 50, 30]);
        setActiveSelections(prev => ({
          ...prev,
          [blockId]: getActiveIndex(blockId) === 0 ? 1 : 0
        }));
      };

      const handleToggleComplete = (blockId) => {
        triggerHaptic(60);
        setCompletedItems(prev => ({
          ...prev,
          [blockId]: !prev[blockId]
        }));
      };

      const handleTicketToggle = (e, optionId) => {
        e.stopPropagation();
        triggerHaptic(40);
        setTicketsSecured(prev => ({
          ...prev,
          [optionId]: !prev[optionId]
        }));
      };

      const stats = useMemo(() => {

              <div className={`w-full max-w-sm p-6 rounded-3xl shadow-2xl ${isHighContrast ? 'bg-white border-2 border-black' : 'bg-white/90 backdrop-blur-xl border border-white/50'}`}>
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-xl font-bold text-slate-800">Budget anpassen</h3>
                  <button onClick={() => setIsEditingBudget(false)} className="p-2 bg-slate-100 rounded-full text-slate-600">{renderIcon('X', {size: 20})}</button>
                </div>
                
                <div className="space-y-5">
                  <div className="bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                    <label className="block text-sm font-bold text-slate-700 flex items-center gap-2 mb-2">
                      {renderIcon('CreditCard', {size: 16, className: "text-blue-600"})}
                      Maximales Budget (in £)
                    </label>
                    <input type="number" value={budgetLimit} onChange={(e) => setBudgetLimit(Number(e.target.value))} className="w-full px-4 py-3 rounded-xl border border-blue-200 bg-white text-lg font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                  </div>

                  <div className="bg-amber-50/50 p-4 rounded-2xl border border-amber-100">
                    <label className="block text-sm font-bold text-slate-700 flex items-center gap-2 mb-2">
                      {renderIcon('PlusCircle', {size: 16, className: "text-amber-600"})}
                      Zusätzliche Ausgaben (in £)
                    </label>
                    <input type="number" value={extraExpenses} onChange={(e) => setExtraExpenses(Number(e.target.value))} className="w-full px-4 py-3 rounded-xl border border-amber-200 bg-white text-lg font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500" />
                  </div>

                  <button onClick={() => { setIsEditingBudget(false); triggerHaptic(40); }} className="w-full py-3.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg mt-2">
                    Speichern
                  </button>
                </div>
              </div>
            </div>
          )}

          {editingItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
              <div className={`w-full max-w-md p-6 rounded-3xl shadow-2xl overflow-y-auto max-h-[90vh] ${isHighContrast ? 'bg-white border-2 border-black' : 'bg-white/95 backdrop-blur-xl border border-white/50'}`}>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-bold text-slate-800">Aktivität bearbeiten</h3>
                  <button onClick={() => setEditingItem(null)} className="p-2 bg-slate-100 rounded-full text-slate-600">{renderIcon('X', {size: 20})}</button>
                </div>
                
                <div className="space-y-4 text-left">
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Titel</label>
                    <input type="text" value={editingItem.data.title} onChange={(e) => setEditingItem({ ...editingItem, data: { ...editingItem.data, title: e.target.value }})} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500" />
                  </div>
                  
                  <div className="flex gap-4">
                    <div className="flex-1">
                      <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Preis (£)</label>
                      <input type="number" value={editingItem.data.price} onChange={(e) => setEditingItem({ ...editingItem, data: { ...editingItem.data, price: Number(e.target.value) }})} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div className="flex-1 flex items-center gap-2 mt-5">
                      <input type="checkbox" id="halal-edit" checked={editingItem.data.halal} onChange={(e) => setEditingItem({ ...editingItem, data: { ...editingItem.data, halal: e.target.checked }})} className="w-5 h-5 rounded text-blue-600 focus:ring-blue-500" />
                      <label htmlFor="halal-edit" className="text-sm font-bold text-slate-700 flex items-center gap-1">
                        Halal {renderIcon('ShieldCheck', {size: 16, className: "text-green-600"})}
                      </label>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Hinweis (Badge)</label>
                    <input type="text" value={editingItem.data.hint} onChange={(e) => setEditingItem({ ...editingItem, data: { ...editingItem.data, hint: e.target.value }})} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                  </div>

                  <div className="flex items-center gap-2">
                    <input type="checkbox" id="ticket-edit" checked={editingItem.data.requiresTicket} onChange={(e) => setEditingItem({ ...editingItem, data: { ...editingItem.data, requiresTicket: e.target.checked }})} className="w-5 h-5 rounded text-blue-600 focus:ring-blue-500" />
                    <label htmlFor="ticket-edit" className="text-sm font-bold text-slate-700">Ticket / Reservierung erforderlich?</label>
                  </div>
                  
                  <button 
                    onClick={() => {
                      setTripData(prev => prev.map(day => {
                        if (day.id !== editingItem.dayId) return day;
                        return {
                          ...day,
                          blocks: day.blocks.map(block => {
                            if (block.id !== editingItem.blockId) return block;
                            return { ...block, options: block.options.map(opt => opt.id === editingItem.optionId ? { ...opt, ...editingItem.data } : opt) }
                          })
                        }
                      }));
                      setEditingItem(null); triggerHaptic(50);
                    }}
                    className="w-full mt-4 py-3 bg-blue-600 text-white rounded-xl font-bold flex justify-center items-center gap-2 hover:bg-blue-700 transition-colors shadow-lg"
                  >
                    {renderIcon('Save', {size: 18})} Änderungen Speichern
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LondonReiseplanerPro />);
  </script>
</body>
</html>
