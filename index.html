              { id: 'o-va', title: 'Victoria and Albert Museum', price: 0, hint: 'Gratis-Ticket vorab reservieren!', requiresTicket: true, bookingLink: 'https://vam.ac.uk', mapsQuery: 'Victoria+and+Albert+Museum+London', halal: false, image: 'https://images.unsplash.com/photo-1566125882500-87e10f726cdc?w=600&q=80' }

            options: [
              { id: 'o-nandos', title: "Nando's Kensington (Halal)", price: 18, hint: 'Walk-in', requiresTicket: false, mapsQuery: 'Nandos+Kensington+High+Street+London', halal: true, image: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=600&q=80' },
              { id: 'o-hyde', title: 'Hyde Park Picknick', price: 10, hint: 'Walk-in', requiresTicket: false, mapsQuery: 'Hyde+Park+London', halal: false, image: 'https://images.unsplash.com/photo-1501692881732-fc223e7386d3?w=600&q=80' }

              { id: 'o-harrods', title: 'Harrods Luxuskaufhaus', price: 0, hint: 'Walk-in', requiresTicket: false, mapsQuery: 'Harrods+London', halal: false, image: 'https://images.unsplash.com/photo-1605333575990-0d3215fcf811?w=600&q=80' }
            ]
          }

    ];

    const triggerHaptic = (pattern = 50) => {
      if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(pattern);
    };

    const openMaps = (e, query) => {
      e.stopPropagation();
      window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
    };

    const openBooking = (e, link) => {
      if(!link) return;
      e.stopPropagation();
      window.open(link, '_blank');
    };

    function LondonReiseplanerPro() {
      const [activeSelections, setActiveSelections] = useState({});
      const [completedItems, setCompletedItems] = useState({});
      const [ticketsSecured, setTicketsSecured] = useState({});
      
      const [tripData, setTripData] = useState(initialItineraryData);
      const [budgetLimit, setBudgetLimit] = useState(500);
      const [extraExpenses, setExtraExpenses] = useState(0);
      
      const [isEditMode, setIsEditMode] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [isEditingBudget, setIsEditingBudget] = useState(false);

      const [isRoutingMode, setIsRoutingMode] = useState(false);
      const [routePoints, setRoutePoints] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);
      
      const [isHighContrast, setIsHighContrast] = useState(false);
      const [isEuro, setIsEuro] = useState(false);
      const [currentTheme, setCurrentTheme] = useState('day');
      
      const EUR_RATE = 1.18;
      const dayRefs = useRef([]);

      // LocalStorage Laden
      useEffect(() => {
        try {
          const savedActive = localStorage.getItem('london_activeSelections');
          const savedCompleted = localStorage.getItem('london_completedItems');
          const savedTickets = localStorage.getItem('london_ticketsSecured');
          const savedTripData = localStorage.getItem('london_tripData');
          const savedBudget = localStorage.getItem('london_budgetLimit');
          const savedExtra = localStorage.getItem('london_extraExpenses');
          
          if(savedActive) setActiveSelections(JSON.parse(savedActive));
          if(savedCompleted) setCompletedItems(JSON.parse(savedCompleted));
          if(savedTickets) setTicketsSecured(JSON.parse(savedTickets));
          if(savedTripData) setTripData(JSON.parse(savedTripData));
          if(savedBudget) setBudgetLimit(JSON.parse(savedBudget));
          if(savedExtra) setExtraExpenses(JSON.parse(savedExtra));
        } catch(e) { console.error("LocalStorage Error", e); }
      }, []);

      // LocalStorage Speichern
      useEffect(() => {
        localStorage.setItem('london_activeSelections', JSON.stringify(activeSelections));
        localStorage.setItem('london_completedItems', JSON.stringify(completedItems));
        localStorage.setItem('london_ticketsSecured', JSON.stringify(ticketsSecured));
        localStorage.setItem('london_tripData', JSON.stringify(tripData));
        localStorage.setItem('london_budgetLimit', JSON.stringify(budgetLimit));
        localStorage.setItem('london_extraExpenses', JSON.stringify(extraExpenses));
      }, [activeSelections, completedItems, ticketsSecured, tripData, budgetLimit, extraExpenses]);

      // Cloud Sync JSONBin
      const syncToCloud = async () => {
        if(JSONBIN_BIN_ID === 'DEINE_BIN_ID_HIER') {
          alert('⚠️ Bitte trage deine JSONBin ID und API Key oben im Code ein, um die Cloud zu nutzen.');
          return;
        }
        setIsSyncing(true);
        triggerHaptic(50);
        try {
          await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify({ activeSelections, completedItems, ticketsSecured, tripData, budgetLimit, extraExpenses })
          });
          triggerHaptic([30, 50, 30]);
          alert('✅ Fortschritt erfolgreich in der Cloud gespeichert!');
        } catch(error) {
          console.error('Sync Error:', error);
          alert('❌ Fehler beim Speichern in der Cloud.');
        } finally {
          setIsSyncing(false);
        }
      };

      const handleRouteSelection = (option) => {
        triggerHaptic(30);
        setRoutePoints(prev => {
          const isSelected = prev.find(p => p.id === option.id);
          if (isSelected) return prev.filter(p => p.id !== option.id);
          return [...prev, option];
        });
      };

      const generateGoogleMapsRoute = () => {
        if (routePoints.length === 0) return;
        triggerHaptic(80);
        const origin = routePoints[0].mapsQuery;
        const destination = routePoints[routePoints.length - 1].mapsQuery;
        let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=walking`;
        if (routePoints.length > 2) {
          const waypoints = routePoints.slice(1, -1).map(p => p.mapsQuery).join('|');
          url += `&waypoints=${waypoints}`;
        }
        window.open(url, '_blank');
        setIsRoutingMode(false);
        setRoutePoints([]);
      };

      useEffect(() => {
        const hour = new Date().getHours();
        if (hour < 6 || hour > 18) setCurrentTheme('night');
        else setCurrentTheme('day');
      }, []);

      const getActiveIndex = (blockId) => activeSelections[blockId] || 0;

      const handleSwap = (e, blockId) => {
        e.stopPropagation();
        triggerHaptic([30, 50, 30]);
        setActiveSelections(prev => ({
          ...prev,
          [blockId]: getActiveIndex(blockId) === 0 ? 1 : 0
        }));
      };

      const handleToggleComplete = (blockId) => {
        triggerHaptic(60);
        setCompletedItems(prev => ({
          ...prev,
          [blockId]: !prev[blockId]
        }));
      };

      const handleTicketToggle = (e, optionId) => {
        e.stopPropagation();
        triggerHaptic(40);
        setTicketsSecured(prev => ({
          ...prev,
          [optionId]: !prev[optionId]
        }));
      };

      const stats = useMemo(() => {
        let totalPound = Number(extraExpenses) || 0;
        let totalItems = 0;
        let completedCount = 0;

        tripData.forEach(day => {
          day.blocks.forEach(block => {
            totalItems++;
            const activeIdx = getActiveIndex(block.id);
            const primaryOption = block.options[activeIdx];
            
            if (completedItems[block.id]) {
              totalPound += Number(primaryOption.price) || 0;
              completedCount++;
            }
          });
        });

        const totalEuro = (totalPound * EUR_RATE).toFixed(0);
        const limitEuro = (budgetLimit * EUR_RATE).toFixed(0);
        const progressPercent = totalItems === 0 ? 0 : Math.round((completedCount / totalItems) * 100);

        return { totalPound, totalEuro, progressPercent, completedCount, totalItems, limitEuro };
      }, [activeSelections, completedItems, tripData, budgetLimit, extraExpenses]);

      const bgMain = isHighContrast 
        ? "bg-white text-black" 
        : (currentTheme === 'day' 
            ? "bg-gradient-to-br from-slate-200 via-gray-100 to-blue-100 text-slate-800" 
            : "bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950 text-slate-100");

      const glassCard = isHighContrast
        ? "bg-white border-2 border-black shadow-none"
        : (currentTheme === 'day'
            ? "bg-white/70 backdrop-blur-xl border border-white/80 shadow-[0_8px_30px_rgb(0,0,0,0.04)]"
            : "bg-slate-800/70 backdrop-blur-xl border border-white/10 shadow-[0_8px_30px_rgb(0,0,0,0.2)]");

      const glassCardCompleted = isHighContrast
        ? "bg-gray-200 border-2 border-gray-400 opacity-80"
        : (currentTheme === 'day'
            ? "bg-slate-100/40 backdrop-blur-md border border-white/30 opacity-70 grayscale-[30%]"
            : "bg-slate-800/40 backdrop-blur-md border border-white/5 opacity-70 grayscale-[30%]");

      const textPrimary = isHighContrast ? "text-black" : (currentTheme === 'day' ? "text-slate-900" : "text-white");
      const textSecondary = isHighContrast ? "text-gray-700" : (currentTheme === 'day' ? "text-slate-500" : "text-slate-400");
      
      const blurDecorations = !isHighContrast && (
        <React.Fragment>
          <div className={`fixed top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full blur-3xl pointer-events-none mix-blend-multiply dark:mix-blend-screen transition-colors duration-1000 ${currentTheme === 'day' ? 'bg-blue-400/20' : 'bg-blue-600/20'}`}></div>
          <div className={`fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full blur-3xl pointer-events-none mix-blend-multiply dark:mix-blend-screen transition-colors duration-1000 ${currentTheme === 'day' ? 'bg-red-400/10' : 'bg-red-600/10'}`}></div>
        </React.Fragment>
      );

      return (
        <div className={`min-h-screen font-sans transition-colors duration-500 selection:bg-blue-500/30 pb-40 ${bgMain} ${isHighContrast ? 'high-contrast-mode' : ''}`}>
          
          {blurDecorations}

          <div className="max-w-3xl mx-auto px-4 pt-8 relative z-10">
            
            {/* Header */}
            <header className="mb-8 flex flex-col items-center">
              <div className="w-full flex justify-between items-start mb-4">
                <button 
                  onClick={() => { triggerHaptic(); setIsHighContrast(!isHighContrast); }}
                  className={`p-3 rounded-full flex items-center justify-center transition-all ${isHighContrast ? 'bg-black text-white' : 'bg-white/40 backdrop-blur-md border border-white/60 text-slate-700'}`}
                  title="Outdoor Modus (High Contrast)"
                >
                  {isHighContrast ? <Sun size={20} /> : <Activity size={20} />}
                </button>
                <div className={`inline-flex flex-col items-center justify-center p-3 rounded-2xl ${isHighContrast ? 'border-2 border-black bg-white' : 'bg-white/40 backdrop-blur-xl border border-white/60 shadow-lg'}`}>
                  <MapPin className="text-blue-600 w-8 h-8" />
                </div>
                <div className="flex gap-2">
                  <button 
                    onClick={syncToCloud}
                    disabled={isSyncing}
                    className={`p-3 rounded-full flex items-center justify-center transition-all ${isHighContrast ? 'hidden' : 'bg-white/40 backdrop-blur-md border border-white/60 text-slate-700'}`}
                    title="Cloud Sync (JSONBin)"
                  >
                    {isSyncing ? <RefreshCw size={20} className="animate-spin" /> : <Cloud size={20} />}
                  </button>
                  <button 
                    onClick={() => { triggerHaptic(); setCurrentTheme(currentTheme === 'day' ? 'night' : 'day'); }}
                    className={`p-3 rounded-full flex items-center justify-center transition-all ${isHighContrast ? 'hidden' : 'bg-white/40 backdrop-blur-md border border-white/60 text-slate-700'}`}
                    title="Theme umschalten"
                  >
                    {currentTheme === 'day' ? <Moon size={20} /> : <Sun size={20} color="white" />}
                  </button>
                </div>
              </div>
              
              <h1 className={`text-4xl md:text-5xl font-extrabold tracking-tight mb-0 text-center ${isHighContrast ? 'text-black' : 'text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-blue-800 dark:from-white dark:to-blue-300'}`}>
                London Trip
              </h1>
              <p className={`text-sm font-bold tracking-widest uppercase mt-2 opacity-80 ${textSecondary}`}>
                made by Ayoub
              </p>
              
              <div className="w-full max-w-md mt-6">
                <div className="flex justify-between text-xs font-bold uppercase tracking-wider mb-2">
                  <span className={textSecondary}>Trip Fortschritt</span>
                  <span className="text-blue-600">{stats.progressPercent}%</span>
                </div>
                <div className={`h-2.5 w-full rounded-full overflow-hidden ${isHighContrast ? 'bg-gray-300 border border-black' : 'bg-white/50 border border-white/40 shadow-inner'}`}>
                  <div 
                    className={`h-full transition-all duration-1000 ease-out ${isHighContrast ? 'bg-black' : 'bg-blue-600 shadow-[0_0_10px_rgba(37,99,235,0.8)]'}`}
                    style={{ width: `${stats.progressPercent}%` }}
                  ></div>
                </div>
              </div>
            </header>

            <div className="space-y-12">
              {tripData.map((day, dayIndex) => (
                <section key={day.id} className="relative" ref={el => dayRefs.current[dayIndex] = el}>
                  
                  <div className="sticky top-4 z-30 mb-6">
                    <div className={`inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl backdrop-blur-xl shadow-sm ${isHighContrast ? 'bg-white border-2 border-black' : (currentTheme === 'day' ? 'bg-white/80 border border-white/80' : 'bg-slate-800/80 border border-white/20')}`}>
                      <CalendarDays className={`w-5 h-5 ${isHighContrast ? 'text-black' : 'text-blue-600'}`} />

                  </div>

                  <button 
                    onClick={() => {
                      setTripData(prev => prev.map(day => {
                        if (day.id !== editingItem.dayId) return day;
                        return {
                          ...day,
                          blocks: day.blocks.map(block => {
                            if (block.id !== editingItem.blockId) return block;
                            return {
                              ...block,
                              options: block.options.map(opt => {
                                if (opt.id !== editingItem.optionId) return opt;
                                return { ...opt, ...editingItem.data };
                              })
                            }
                          })
                        }
                      }));
                      setEditingItem(null);
                      triggerHaptic(50);
                    }}
                    className="w-full mt-4 py-3 bg-blue-600 text-white rounded-xl font-bold flex justify-center items-center gap-2 hover:bg-blue-700 transition-colors shadow-lg shadow-blue-600/30"
                  >
                    <Save size={18} /> Änderungen Speichern
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LondonReiseplanerPro />);
  </script>
</body>
</html>
